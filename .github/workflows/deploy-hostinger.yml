# ─────────────────────────────────────────────────────────────
#  Deploy do GTA-Tech (Vite SPA) para o Hostinger via FTP
#
#  O SSH dos runners do GitHub é bloqueado pelo firewall da
#  Hostinger em hospedagem partilhada (Connection timed out),
#  por isso o deploy é feito por FTPS (porta 21), que não é
#  bloqueado.
#
#  Pré-requisitos (uma vez):
#    1. Configurar os secrets no GitHub
#       (Settings → Secrets and variables → Actions):
#         FTP_HOST  → servidor FTP, SOZINHO, sem prefixo
#                     (ex: 31.220.106.101  — SEM "ftp://")
#         FTP_USER  → utilizador FTP
#         FTP_PASS  → palavra-passe FTP
#    2. Criar/utilizar uma conta FTP em hPanel → Files → FTP Accounts.
#    3. O server-dir é dist/ (o FTP root na Hostinger já é public_html/).
# ─────────────────────────────────────────────────────────────
name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-hostinger
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Verificar dist e .htaccess
        run: |
          test -f dist/index.html
          test -f dist/.htaccess || { echo "dist/.htaccess em falta"; exit 1; }

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          timeout: 90000
          local-dir: ./dist/
          server-dir: dist/
          dangerous-clean-slate: true
          exclude: |
            **/.DS_Store

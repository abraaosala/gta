# ─────────────────────────────────────────────────────────────
#  Deploy do GTA-Tech (Vite SPA) para o Hostinger via SSH
#
#  Pré-requisitos (uma vez):
#    1. Configurar os secrets no GitHub
#       (Settings → Secrets and variables → Actions):
#         SSH_PRIVATE_KEY  → chave privada SSH global do Hostinger
#         SSH_HOST         → IP/domínio do servidor (default: 31.220.106.101)
#         SSH_USER         → utilizador SSH (default: u634834160)
#         SSH_PORT         → porta SSH (default: 65002)
#         TARGET_PATH_GTA  → caminho absoluto da pasta pública no Hostinger
#                            (a pasta onde ficam index.html e assets)
#    2. Adicionar o host ao known_hosts na primeira execução:
#       o passo "Confirmar known_hosts" faz ssh-keyscan automaticamente,
#       mas se o runner não aceitar, adicione manualmente o output de
#       `ssh-keyscan -H <IP>` como secret SSH_HOST_KEY.
# ─────────────────────────────────────────────────────────────
name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-hostinger
    env:
      REMOTE_HOST: ${{ secrets.SSH_HOST || '31.220.106.101' }}
      REMOTE_USER: ${{ secrets.SSH_USER || 'u634834160' }}
      REMOTE_PORT: ${{ secrets.SSH_PORT || '65002' }}
      REMOTE_TARGET: ${{ secrets.TARGET_PATH_GTA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verificar dist e .htaccess
        run: |
          test -f dist/index.html
          test -f dist/.htaccess || { echo "dist/.htaccess em falta"; exit 1; }

      - name: Configurar chave SSH e known_hosts
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$REMOTE_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName $REMOTE_HOST
            User $REMOTE_USER
            Port $REMOTE_PORT
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
          EOF
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Empacotar dist
        run: tar -czf deploy.tgz -C dist .

      - name: Testar ligação SSH
        run: ssh hostinger "echo 'SSH OK — ' \$(hostname)"

      - name: Limpar pasta remota e enviar
        run: |
          if [ -z "$REMOTE_TARGET" ] || [ "$REMOTE_TARGET" = "/" ]; then
            echo "::error::TARGET_PATH_GTA está vazio ou é inválido. Abortando deploy para evitar apagar dados."
            exit 1
          fi
          ssh hostinger "mkdir -p '$REMOTE_TARGET' && rm -rf '$REMOTE_TARGET'/* '$REMOTE_TARGET'/.[!.]* 2>/dev/null || true"
          scp -q deploy.tgz hostinger:/tmp/deploy.tgz
          ssh hostinger "tar -xzf /tmp/deploy.tgz -C '$REMOTE_TARGET' && rm -f /tmp/deploy.tgz"
          echo "Deploy concluído para $REMOTE_TARGET"

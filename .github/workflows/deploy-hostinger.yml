# ─────────────────────────────────────────────────────────────
#  Deploy do GTA-Tech (Vite SPA) para o Hostinger via SSH + rsync
#
#  O deploy é feito por SSH (porta 65002) com rsync, usando a
#  chave privada que já está autorizada no servidor
#  (~/.ssh/authorized_keys do utilizador).
#
#  Pré-requisitos (uma vez):
#    1. Configurar os secrets no GitHub
#       (Settings → Secrets and variables → Actions):
#         SSH_KEY       → conteúdo da chave privada autorizada
#                         no servidor (ex: ---BEGIN OPENSSH---)
#         SSH_HOST      → IP/hostname do servidor (ex: 31.220.106.101)
#         SSH_PORT      → porta SSH (Exemplo Hostinger: 65002)
#         SSH_USERNAME  → utilizador SSH (ex: u634834160)
#    2. Criar uma variável no GitHub (Settings → Variables):
#         SSH_TARGET_DIR → caminho ABSOLUTO de destino no servidor
#                          (ex: /home/u634834160/domains/gtatech.ao/public_html/dist/)
# ─────────────────────────────────────────────────────────────
name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-hostinger
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Verificar dist e .htaccess
        run: |
          test -f dist/index.html
          test -f dist/.htaccess || { echo "dist/.htaccess em falta"; exit 1; }

      - name: Configurar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Adicionar servidor aos known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH + rsync
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }}" \
            ./dist/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ vars.SSH_TARGET_DIR }}